# Server Config (Supports dynamic cloud PORT env var like Render/Railway/Heroku)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=lostfound-backend

# Database Configuration (Persistent file-based database in ./data/ folder; zero external setup required for client)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lostfound_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# Multipart File Upload (Max 10MB for item images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret & Expiration (24 hours)
jwt.secret=CollegeLostAndFoundManagementSystemSecretKeyForJWTAuth2026SecureStringWith256BitsLength
jwt.expiration=86400000

# Logging - hide verbose startup noise
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
